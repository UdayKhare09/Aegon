[package]
name = "bench_actix_appstack"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = { version = "4" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
flate2 = { version = "1" }
mimalloc = { version = "0.1", default-features = false }

[profile.release]
opt-level = 3
codegen-units = 1
lto = "thin"
panic = "abort"
