name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Arch Linux Package in Clean Container
        run: |
          docker run --rm -v "${PWD}:/workspace" -w /workspace archlinux:latest bash -c "
            pacman -Syu --noconfirm --needed base-devel cmake ninja gcc git sudo \
              liburing openssl sqlite postgresql-libs \
              libnghttp2 libngtcp2 libnghttp3 libdeflate glaze && \
            useradd -m builder && \
            echo 'builder ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers && \
            chown -R builder:builder /workspace && \
            su builder -c 'cd /workspace/packaging/arch && makepkg -f'
          "

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: packaging/arch/*.pkg.tar.zst
          generate_release_notes: true
          draft: false
          prerelease: false
